<div>
    <h2>Order History</h2>
    <p>This is where the order history will be displayed.</p>
    <section *ngIf="orders.length > 0;">
      <div *ngFor="let order of orders" class="order">
        <h3>Order ID: {{ order.id }}</h3>
        <p>Date: {{ order.date | date }}</p>
        <p>Total: {{ order.total | currency }}</p>
        <div class="order-items">
          <h4>Items:</h4>
          <ul>
            <li *ngFor="let item of order.items">
                {{order.items}}
            </li>
          </ul>
        </div>
      </div>
    </section>
    
    <section *ngIf="orders.length === 0;">
      <p>No orders found.</p>
    </section>
  </div>
