<div *ngIf="cartItems$ | async as items">
  <div *ngFor="let item of items" class="cart-item">
    <app-product [Product]="item"></app-product>
    <button mat-button color="warn" (click)="removeItem(item.id)">Eliminar</button>
  </div>

  <div class="cart-total">
    <p>Total: ${{ getTotalPrice() }}</p>
    <button mat-raised-button color="accent" (click)="clearCart()">Vaciar carrito</button>
  </div>
</div>
