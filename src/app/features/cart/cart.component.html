<div>
    <h2>Shopping Cart</h2>
    <div *ngIf="cartItems.length === 0">
        <p>Your cart is empty.</p>
    </div>
    <div *ngIf="cartItems.length > 0">
        <app-product *ngFor="let item of cartItems" [Product]="item"></app-product>
        <p>Total: ${{ getTotalPrice() }}</p>
        <button (click)="clearCart()">Clear Cart</button>
    </div>
</div>
