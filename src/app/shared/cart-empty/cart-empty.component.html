<div class="cart-empty-container">
  <mat-card class="cart-empty-card">
    <mat-card-content>
      <h2>El carrito está vacío</h2>
      <p>Agrega productos para comenzar tu compra.</p>
    </mat-card-content> 
    <mat-card-actions>
      <button mat-raised-button class="redirectToProducts" (click)="redirectToProducts()">
        <mat-icon>storefront</mat-icon>
        Ver Productos
      </button>
    </mat-card-actions>
  </mat-card>
</div>
