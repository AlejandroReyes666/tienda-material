<div class="form-container">
    <mat-card class="contact-card">
    <mat-card-header>
        <mat-card-title class="card-title">Contactanos</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="name" />
            <mat-error *ngIf="errorMessages.name()">{{ errorMessages.name() }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" />
            <mat-error *ngIf="errorMessages.email()">{{ errorMessages.email() }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Teléfono</mat-label>
            <input matInput formControlName="phone" />
            <mat-error *ngIf="errorMessages.phone()">{{ errorMessages.phone() }}</mat-error>
        </mat-form-field>
        <!-- Solo para "trabaja con nosotros" -->
        <ng-container *ngIf="isWorkMode()">
            <mat-form-field appearance="outline" class="full-width">
            <mat-label>Cargo de Interés</mat-label>
            <input matInput formControlName="position" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
            <mat-label>LinkedIn (opcional)</mat-label>
            <input matInput formControlName="linkedin" />
            </mat-form-field>
        </ng-container>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Mensaje</mat-label>
            <textarea matInput formControlName="message"
                rows="5" 
                cdkTextareaAutosize
                cdkAutosizeMinRows="3"
                cdkAutosizeMaxRows="6">></textarea>
            <mat-error *ngIf="errorMessages.message()">{{ errorMessages.message() }}</mat-error>
        </mat-form-field>

        <div class="button-container">
            <button mat-raised-button class="enviar" color="primary" type="submit">Enviar</button>
        </div>
        
        </form>
        </mat-card-content>
    </mat-card>
</div>
