
<h2 mat-dialog-title>{{ data ? 'Editar Producto' : 'Agregar Producto' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()" class="p-4">
  <mat-form-field appearance="fill" class="w-full mb-4">
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="nombre">
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-full mb-4">
    <mat-label>Precio</mat-label>
    <input matInput type="number" formControlName="precio">
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-full mb-4">
    <mat-label>Imagen (URL)</mat-label>
    <input matInput formControlName="imageUrl">
  </mat-form-field>

 <mat-form-field appearance="fill" class="w-full mb-4">
    <mat-label>Categoria</mat-label>
    <input matInput formControlName="categoria">
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-full mb-4">
    <mat-label>Descripción</mat-label>
    <textarea matInput formControlName="descripcion"></textarea>
  </mat-form-field>

  <div [ngClass]="{'flex justify-end gap-2 mt-4' :true,'dialog-actions':true }" >
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Guardar</button>
  </div>
</form>
