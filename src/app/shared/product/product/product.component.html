<mat-card class="producto-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image"></div>
    <mat-card-title>{{ Product.nombre }}</mat-card-title>
    <mat-card-subtitle>{{ Product.categoria }}</mat-card-subtitle>
  </mat-card-header>

  <img
    mat-card-image
    src={{Product.imageUrl}}
    alt="Foto del producto"
  />

  <mat-card-content>
    <p>{{Product.descripcion}}</p>
  </mat-card-content>
  <mat-card-actions>
    <button class="btn-info" matButton (click)="actualizarProducto()">Editar</button>
    <button class="btn-danger " matButton (click)="eliminarProducto()">Eliminar</button>
  </mat-card-actions>
</mat-card>
