<mat-card class="producto-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image"></div>
    <mat-card-title>{{ Product.nombre }}</mat-card-title>
    <mat-card-subtitle>{{ Product.categoria }}</mat-card-subtitle>
  </mat-card-header>

  <img
    mat-card-image
    src={{Product.imageUrl}}
    alt="Foto del producto"
  />

  <mat-card-content>
    <p>{{Product.descripcion}}</p>
  </mat-card-content>
 <mat-card-actions>
    <div class="button-group">
      <button mat-flat-button class="btn-editar" (click)="actualizarProducto()">
        <mat-icon>edit</mat-icon> Editar
      </button>
      <button mat-flat-button class="btn-eliminar" (click)="openDialogEliminar(Product)">
        <mat-icon>delete</mat-icon> Eliminar
      </button>
    </div>
</mat-card-actions>
</mat-card>
