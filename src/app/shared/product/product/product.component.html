<mat-card class="producto-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image"></div>
    <mat-card-title>{{ Product.nombre }}</mat-card-title>
    <mat-card-subtitle>{{ Product.categoria }}</mat-card-subtitle>
  </mat-card-header>

  <img
    mat-card-image
    src="https://material.angular.dev/assets/img/examples/shiba2.jpg"
    alt="Foto del producto"
  />

  <mat-card-content>
    <p>{{Product.descripcion}}</p>
  </mat-card-content>
</mat-card>
